<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>part artwork preview</title>
<style>
  body { margin: 0; padding: 24px; background: #0b1622; color: #cfe6f7;
         font: 13px/1.4 ui-monospace, monospace; }
  h2 { grid-column: 1 / -1; font-size: 13px; letter-spacing: .16em; color: #7fd0ff;
       text-transform: uppercase; margin: 22px 0 4px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
  .cell { background: #101f30; border: 1px solid #1e3a52; border-radius: 8px;
          padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { height: 150px; display: flex; align-items: center; justify-content: center; }
  .box img { max-height: 150px; max-width: 100%; }
  .name { color: #9fd7f5; }
  .meta { color: #5d7d95; font-size: 11px; }
</style>
</head>
<body>
<div id="root">loading…</div>
<script type="module">
import {PART_DEFINITIONS as D, CATEGORY_ORDER} from './js/rocket/partDefinitions.js';

const root = document.querySelector('#root');
let html = '<div class="grid">';
for (const cat of CATEGORY_ORDER) {
  html += '<h2>' + cat + '</h2>';
  for (const [id, def] of Object.entries(D).filter(([, d]) => d.category === cat)) {
    html += '<div class="cell">' +
      '<div class="box"><img src="' + (def.png || def.svg) + '" alt="' + id + '"></div>' +
      '<div class="name">' + def.name + '</div>' +
      '<div class="meta">' + id + ' · ' + def.width + '×' + def.height + '</div>' +
      '</div>';
  }
}
root.innerHTML = html + '</div>';
</script>
</body>
</html>
