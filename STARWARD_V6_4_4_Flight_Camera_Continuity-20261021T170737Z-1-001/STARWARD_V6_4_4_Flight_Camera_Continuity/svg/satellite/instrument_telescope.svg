<!-- instrument_telescope.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 40" width="80" height="40" data-part-id="instrument_telescope" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>:root{--hull-light:#e8eef5;--hull-mid:#b8c4d2;--hull-dark:#6d7c8f;--hull-shadow:#3a4656;--metal-dark:#2a3340;--accent-cyan:#22e5f0;--accent-amber:#ffb347;--glow-engine:#ff7a2f;--solar-cell:#1b3a6b;--solar-grid:#4f7fc0;--line:#0e1520}.hl{stop-color:var(--hull-light)}.hm{stop-color:var(--hull-mid)}.hd{stop-color:var(--hull-dark)}.hs{stop-color:var(--hull-shadow)}.md{stop-color:var(--metal-dark)}.cy{stop-color:var(--accent-cyan)}.ge{stop-color:var(--glow-engine)}.fmd{fill:var(--metal-dark)}.fln{fill:var(--line)}.fcy{fill:var(--accent-cyan)}.fam{fill:var(--accent-amber)}.fge{fill:var(--glow-engine)}.fsc{fill:var(--solar-cell)}.pl{fill:none;stroke:var(--line);stroke-width:.5;opacity:.45}.hi{fill:none;stroke:var(--hull-light);stroke-width:.5;opacity:.35}.edge{fill:none;stroke:var(--line);stroke-width:.8;opacity:.55}.frame{stroke:var(--hull-shadow);stroke-width:.6}.gl{fill:none;stroke:var(--accent-cyan);stroke-width:.8;stroke-linecap:round;opacity:.8}.cs{fill:none;stroke:var(--accent-cyan);stroke-width:1.1;opacity:.55}.st{fill:none;stroke:var(--hull-shadow);stroke-width:2.6;stroke-linecap:round}.st2{fill:none;stroke:var(--hull-shadow);stroke-width:1.6;stroke-linecap:round}.pipe{fill:none;stroke:var(--hull-dark);stroke-width:2.4}.pipe2{fill:none;stroke:var(--hull-dark);stroke-width:1.6}.ls{fill:none;stroke:var(--hull-shadow);stroke-linecap:round}.lm{fill:none;stroke:var(--hull-mid);stroke-linecap:round}.lh{fill:none;stroke:var(--hull-light);stroke-linecap:round;opacity:.6}.dash{fill:none;stroke:var(--accent-amber);stroke-width:1;stroke-dasharray:6 4;opacity:.85}.node{fill:none;stroke:none}</style>
<defs><linearGradient id="it-c"><stop offset="0" class="hm"/><stop offset=".25" class="hl"/><stop offset=".55" class="hm"/><stop offset="1" class="hs"/></linearGradient><linearGradient id="it-d"><stop offset="0" class="hs"/><stop offset=".25" class="hd"/><stop offset=".55" class="hs"/><stop offset="1" class="md"/></linearGradient><linearGradient id="it-m"><stop offset="0" class="hd"/><stop offset=".25" class="hm"/><stop offset=".55" class="hd"/><stop offset="1" class="hs"/></linearGradient><linearGradient id="it-r"><stop offset="0" class="cy" stop-opacity="0"/><stop offset="1" class="cy" stop-opacity=".16"/></linearGradient><linearGradient id="it-v" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="hm"/><stop offset=".25" class="hl"/><stop offset=".55" class="hm"/><stop offset="1" class="hs"/></linearGradient><linearGradient id="it-vd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="hs"/><stop offset=".25" class="hd"/><stop offset=".55" class="hs"/><stop offset="1" class="md"/></linearGradient></defs>
<g id="body"><rect x="68" y="11" width="12" height="18" rx="2" fill="url(#it-vd)"/><path d="M26 32H60L56 40H30Z" fill="url(#it-vd)"/><rect x="14" y="8" width="56" height="24" fill="url(#it-v)"/><path d="M16 8L6 3V37L16 32Z" fill="url(#it-vd)"/><ellipse cx="6" cy="20" rx="2.4" ry="15" class="fln"/><rect x="30" y="6" width="3" height="28" fill="url(#it-vd)"/><rect x="36" y="7" width="1.5" height="26" fill="url(#it-vd)"/></g>
<g id="details"><path class="gl" d="M5.6 9V16"/><rect x="14" y="19" width="56" height="1.1" class="fcy" opacity=".45"/><path class="pl" d="M50 8V32M60 8V32"/><rect x="76" y="11" width="4" height="18" fill="url(#it-r)"/><path class="edge" d="M14 8.4H68M14 31.6H68"/></g>
<g id="lights"><circle cx="74" cy="16" r="2.6" class="fcy" opacity=".22"/><circle cx="74" cy="16" r="1.2" class="fcy"/><circle cx="74" cy="24" r="2.6" class="fam" opacity=".22"/><circle cx="74" cy="24" r="1.2" class="fam"/></g>
