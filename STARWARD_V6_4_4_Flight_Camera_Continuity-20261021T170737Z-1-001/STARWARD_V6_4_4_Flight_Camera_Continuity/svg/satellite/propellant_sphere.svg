<!-- propellant_sphere.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" data-part-id="propellant_sphere" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>:root{--hull-light:#e8eef5;--hull-mid:#b8c4d2;--hull-dark:#6d7c8f;--hull-shadow:#3a4656;--metal-dark:#2a3340;--accent-cyan:#22e5f0;--accent-amber:#ffb347;--glow-engine:#ff7a2f;--solar-cell:#1b3a6b;--solar-grid:#4f7fc0;--line:#0e1520}.hl{stop-color:var(--hull-light)}.hm{stop-color:var(--hull-mid)}.hd{stop-color:var(--hull-dark)}.hs{stop-color:var(--hull-shadow)}.md{stop-color:var(--metal-dark)}.cy{stop-color:var(--accent-cyan)}.ge{stop-color:var(--glow-engine)}.fmd{fill:var(--metal-dark)}.fln{fill:var(--line)}.fcy{fill:var(--accent-cyan)}.fam{fill:var(--accent-amber)}.fge{fill:var(--glow-engine)}.fsc{fill:var(--solar-cell)}.pl{fill:none;stroke:var(--line);stroke-width:.5;opacity:.45}.hi{fill:none;stroke:var(--hull-light);stroke-width:.5;opacity:.35}.edge{fill:none;stroke:var(--line);stroke-width:.8;opacity:.55}.frame{stroke:var(--hull-shadow);stroke-width:.6}.gl{fill:none;stroke:var(--accent-cyan);stroke-width:.8;stroke-linecap:round;opacity:.8}.cs{fill:none;stroke:var(--accent-cyan);stroke-width:1.1;opacity:.55}.st{fill:none;stroke:var(--hull-shadow);stroke-width:2.6;stroke-linecap:round}.st2{fill:none;stroke:var(--hull-shadow);stroke-width:1.6;stroke-linecap:round}.pipe{fill:none;stroke:var(--hull-dark);stroke-width:2.4}.pipe2{fill:none;stroke:var(--hull-dark);stroke-width:1.6}.ls{fill:none;stroke:var(--hull-shadow);stroke-linecap:round}.lm{fill:none;stroke:var(--hull-mid);stroke-linecap:round}.lh{fill:none;stroke:var(--hull-light);stroke-linecap:round;opacity:.6}.dash{fill:none;stroke:var(--accent-amber);stroke-width:1;stroke-dasharray:6 4;opacity:.85}.node{fill:none;stroke:none}</style>
<defs><linearGradient id="ps-c"><stop offset="0" class="hm"/><stop offset=".25" class="hl"/><stop offset=".55" class="hm"/><stop offset="1" class="hs"/></linearGradient><linearGradient id="ps-d"><stop offset="0" class="hs"/><stop offset=".25" class="hd"/><stop offset=".55" class="hs"/><stop offset="1" class="md"/></linearGradient><linearGradient id="ps-m"><stop offset="0" class="hd"/><stop offset=".25" class="hm"/><stop offset=".55" class="hd"/><stop offset="1" class="hs"/></linearGradient><linearGradient id="ps-r"><stop offset="0" class="cy" stop-opacity="0"/><stop offset="1" class="cy" stop-opacity=".16"/></linearGradient><radialGradient id="ps-sp" cx=".5" cy=".5" r=".6" fx=".35" fy=".3"><stop offset="0" class="hl"/><stop offset=".55" class="hm"/><stop offset="1" class="hs"/></radialGradient><clipPath id="ps-k"><circle cx="20" cy="18" r="15"/></clipPath></defs>
<g id="body"><rect x="6" y="34" width="28" height="6" fill="url(#ps-d)"/><rect x="8" y="30" width="3" height="5" fill="url(#ps-d)"/><rect x="29" y="30" width="3" height="5" fill="url(#ps-d)"/><rect x="17" width="6" height="4" fill="url(#ps-d)"/><circle cx="20" cy="18" r="15" fill="url(#ps-sp)"/></g>
<g id="details"><ellipse cx="20" cy="18" rx="15" ry="3" class="pl"/><ellipse cx="20" cy="18" rx="15" ry="3" class="cs" style="stroke-dasharray:30 17;opacity:.45"/><g clip-path="url(#ps-k)"><rect x="28" width="12" height="40" fill="url(#ps-r)"/></g></g>
<g id="lights"><circle cx="13" cy="37" r="2.6" class="fcy" opacity=".22"/><circle cx="13" cy="37" r="1.2" class="fcy"/></g>
<g id="nodes"><circle class="node" data-type="surface" data-x="20" data-y="40" cx="20" cy="40" r="2"/><circle class="node" data-type="surface" data-x="20" data-y="0" cx="20" cy="0" r="2"/></g>
</svg>
