<g id="details"><rect x="12" y="13" width="16" height="1" class="fcy" opacity=".55"/><path class="pl" d="M12 18H28"/><path class="edge" d="M6.4 14V32"/><rect x="31" y="14" width="3" height="18" fill="url(#gp-r)"/></g>
