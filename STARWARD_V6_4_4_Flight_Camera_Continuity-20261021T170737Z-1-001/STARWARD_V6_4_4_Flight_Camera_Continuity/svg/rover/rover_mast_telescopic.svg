<!-- rover_mast_telescopic.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 100" width="20" height="100" data-part-id="rover_mast_telescopic" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>:root{--hull-light:#e8eef5;--hull-mid:#b8c4d2;--hull-dark:#6d7c8f;--hull-shadow:#3a4656;--metal-dark:#2a3340;--accent-cyan:#22e5f0;--accent-amber:#ffb347;--glow-engine:#ff7a2f;--solar-cell:#1b3a6b;--solar-grid:#4f7fc0;--line:#0e1520}.hl{stop-color:var(--hull-light)}.hm{stop-color:var(--hull-mid)}.hd{stop-color:var(--hull-dark)}.hs{stop-color:var(--hull-shadow)}.md{stop-color:var(--metal-dark)}.cy{stop-color:var(--accent-cyan)}.ge{stop-color:var(--glow-engine)}.am{stop-color:var(--accent-amber)}.fmd{fill:var(--metal-dark)}.fln{fill:var(--line)}.fcy{fill:var(--accent-cyan)}.fam{fill:var(--accent-amber)}.fge{fill:var(--glow-engine)}.fsc{fill:var(--solar-cell)}.pl{fill:none;stroke:var(--line);stroke-width:.5;opacity:.45}.hi{fill:none;stroke:var(--hull-light);stroke-width:.5;opacity:.35}.edge{fill:none;stroke:var(--line);stroke-width:.8;opacity:.55}.frame{stroke:var(--hull-shadow);stroke-width:.6}.gl{fill:none;stroke:var(--accent-cyan);stroke-width:.8;stroke-linecap:round;opacity:.8}.cs{fill:none;stroke:var(--accent-cyan);stroke-width:1.1;opacity:.55}.st{fill:none;stroke:var(--hull-shadow);stroke-width:2.6;stroke-linecap:round}.st2{fill:none;stroke:var(--hull-shadow);stroke-width:1.6;stroke-linecap:round}.pipe{fill:none;stroke:var(--hull-dark);stroke-width:2.4}.pipe2{fill:none;stroke:var(--hull-dark);stroke-width:1.6}.ls{fill:none;stroke:var(--hull-shadow);stroke-linecap:round}.lm{fill:none;stroke:var(--hull-mid);stroke-linecap:round}.lh{fill:none;stroke:var(--hull-light);stroke-linecap:round;opacity:.6}.dash{fill:none;stroke:var(--accent-amber);stroke-width:1;stroke-dasharray:6 4;opacity:.85}.node{fill:none;stroke:none}</style>
<defs><linearGradient id="mt-c"><stop offset="0" class="hm"/><stop offset=".25" class="hl"/><stop offset=".55" class="hm"/><stop offset="1" class="hs"/></linearGradient><linearGradient id="mt-d"><stop offset="0" class="hs"/><stop offset=".25" class="hd"/><stop offset=".55" class="hs"/><stop offset="1" class="md"/></linearGradient><linearGradient id="mt-m"><stop offset="0" class="hd"/><stop offset=".25" class="hm"/><stop offset=".55" class="hd"/><stop offset="1" class="hs"/></linearGradient><linearGradient id="mt-r"><stop offset="0" class="cy" stop-opacity="0"/><stop offset="1" class="cy" stop-opacity=".16"/></linearGradient></defs>
<g id="body"><rect x="4" y="90" width="12" height="10" fill="url(#mt-d)"/><rect x="6" y="60" width="8" height="30" fill="url(#mt-c)"/><rect x="5" y="58" width="10" height="3" fill="url(#mt-d)"/><rect x="7" y="34" width="6" height="26" fill="url(#mt-c)"/><rect x="6" y="32" width="8" height="3" fill="url(#mt-d)"/><rect x="8.4" y="16" width="3.2" height="18" fill="url(#mt-c)"/><rect x="7.4" y="14.5" width="5.2" height="2.5" fill="url(#mt-d)"/><rect x="3" y="4" width="14" height="10" rx="1.2" fill="url(#mt-c)"/><circle cx="8" cy="9" r="3" class="fmd frame"/><circle cx="8" cy="9" r="1.6" class="fln"/><rect x="12" y="7" width="4" height="1.6" rx=".6" class="fln"/><rect x="9" y="1" width="2" height="3" fill="url(#mt-d)"/></g>
<g id="details"><rect x="6" y="75" width="8" height=".9" class="fcy" opacity=".5"/><rect x="7" y="46" width="6" height=".9" class="fcy" opacity=".5"/><path class="gl" d="M6.6 8Q7.4 7.2 8.6 7.4"/></g>
<g id="lights"><circle cx="10" cy="95" r="2.6" class="fcy" opacity=".22"/><circle cx="10" cy="95" r="1.2" class="fcy"/></g>
<g id="nodes"><circle class="node" data-type="surface" data-x="10" data-y="100" cx="10" cy="100" r="2"/></g>
</svg>
