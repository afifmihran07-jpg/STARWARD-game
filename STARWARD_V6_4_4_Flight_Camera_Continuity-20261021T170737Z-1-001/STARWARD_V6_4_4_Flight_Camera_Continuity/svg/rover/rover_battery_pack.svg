<!-- rover_battery_pack.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 20" width="60" height="20" data-part-id="rover_battery_pack" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>:root{--hull-light:#e8eef5;--hull-mid:#b8c4d2;--hull-dark:#6d7c8f;--hull-shadow:#3a4656;--metal-dark:#2a3340;--accent-cyan:#22e5f0;--accent-amber:#ffb347;--glow-engine:#ff7a2f;--solar-cell:#1b3a6b;--solar-grid:#4f7fc0;--line:#0e1520}.hl{stop-color:var(--hull-light)}.hm{stop-color:var(--hull-mid)}.hd{stop-color:var(--hull-dark)}.hs{stop-color:var(--hull-shadow)}.md{stop-color:var(--metal-dark)}.cy{stop-color:var(--accent-cyan)}.ge{stop-color:var(--glow-engine)}.fmd{fill:var(--metal-dark)}.fln{fill:var(--line)}.fcy{fill:var(--accent-cyan)}.fam{fill:var(--accent-amber)}.fge{fill:var(--glow-engine)}.fsc{fill:var(--solar-cell)}.pl{fill:none;stroke:var(--line);stroke-width:.5;opacity:.45}.hi{fill:none;stroke:var(--hull-light);stroke-width:.5;opacity:.35}.edge{fill:none;stroke:var(--line);stroke-width:.8;opacity:.55}.frame{stroke:var(--hull-shadow);stroke-width:.6}.gl{fill:none;stroke:var(--accent-cyan);stroke-width:.8;stroke-linecap:round;opacity:.8}.cs{fill:none;stroke:var(--accent-cyan);stroke-width:1.1;opacity:.55}.st{fill:none;stroke:var(--hull-shadow);stroke-width:2.6;stroke-linecap:round}.st2{fill:none;stroke:var(--hull-shadow);stroke-width:1.6;stroke-linecap:round}.pipe{fill:none;stroke:var(--hull-dark);stroke-width:2.4}.pipe2{fill:none;stroke:var(--hull-dark);stroke-width:1.6}.ls{fill:none;stroke:var(--hull-shadow);stroke-linecap:round}.lm{fill:none;stroke:var(--hull-mid);stroke-linecap:round}.lh{fill:none;stroke:var(--hull-light);stroke-linecap:round;opacity:.6}.dash{fill:none;stroke:var(--accent-amber);stroke-width:1;stroke-dasharray:6 4;opacity:.85}.node{fill:none;stroke:none}</style>
<defs><linearGradient id="rp-c"><stop offset="0" class="hm"/><stop offset=".25" class="hl"/><stop offset=".55" class="hm"/><stop offset="1" class="hs"/></linearGradient><linearGradient id="rp-d"><stop offset="0" class="hs"/><stop offset=".25" class="hd"/><stop offset=".55" class="hs"/><stop offset="1" class="md"/></linearGradient><linearGradient id="rp-m"><stop offset="0" class="hd"/><stop offset=".25" class="hm"/><stop offset=".55" class="hd"/><stop offset="1" class="hs"/></linearGradient><linearGradient id="rp-r"><stop offset="0" class="cy" stop-opacity="0"/><stop offset="1" class="cy" stop-opacity=".16"/></linearGradient><linearGradient id="rp-b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="hl"/><stop offset=".5" class="hm"/><stop offset="1" class="hd"/></linearGradient></defs>
<g id="body"><rect x="2" y="2" width="56" height="16" rx="2" fill="url(#rp-b)"/><rect x="2" y="2" width="56" height="3" rx="1.5" fill="url(#rp-d)"/><rect x="2" y="15" width="56" height="3" rx="1.5" fill="url(#rp-d)"/></g>
<g id="details"><rect x="8" y="7" width="44" height="6" rx="1" class="fln frame"/><rect x="10.0" y="8" width="3.4" height="4" class="fcy" opacity=".85"/><rect x="15.2" y="8" width="3.4" height="4" class="fcy" opacity=".85"/><rect x="20.4" y="8" width="3.4" height="4" class="fcy" opacity=".85"/><rect x="25.6" y="8" width="3.4" height="4" class="fcy" opacity=".85"/><rect x="30.8" y="8.4" width="3.4" height="3.6" class="fcy" opacity=".85"/><rect x="36.0" y="9" width="3.4" height="3" class="fcy" opacity=".85"/><rect x="41.2" y="10" width="3.4" height="2" class="fcy" opacity=".85"/><rect x="46.4" y="10.5" width="3.4" height="1.5" class="fcy" opacity=".85"/><rect x="53" y="2" width="5" height="16" fill="url(#rp-r)"/></g>
<g id="lights"><circle cx="5" cy="10" r="2.6" class="fam" opacity=".22"/><circle cx="5" cy="10" r="1.2" class="fam"/></g>
<g id="nodes"><circle class="node" data-type="surface" data-x="30" data-y="0" cx="30" cy="0" r="2"/><circle class="node" data-type="surface" data-x="30" data-y="20" cx="30" cy="20" r="2"/></g>
</svg>
