<!-- rover_mast_camera.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 80" width="40" height="80" data-part-id="rover_mast_camera" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>:root{--hull-light:#e8eef5;--hull-mid:#b8c4d2;--hull-dark:#6d7c8f;--hull-shadow:#3a4656;--metal-dark:#2a3340;--accent-cyan:#22e5f0;--accent-amber:#ffb347;--glow-engine:#ff7a2f;--solar-cell:#1b3a6b;--solar-grid:#4f7fc0;--line:#0e1520}.hl{stop-color:var(--hull-light)}.hm{stop-color:var(--hull-mid)}.hd{stop-color:var(--hull-dark)}.hs{stop-color:var(--hull-shadow)}.md{stop-color:var(--metal-dark)}.cy{stop-color:var(--accent-cyan)}.ge{stop-color:var(--glow-engine)}.fmd{fill:var(--metal-dark)}.fln{fill:var(--line)}.fcy{fill:var(--accent-cyan)}.fam{fill:var(--accent-amber)}.fge{fill:var(--glow-engine)}.fsc{fill:var(--solar-cell)}.pl{fill:none;stroke:var(--line);stroke-width:.5;opacity:.45}.hi{fill:none;stroke:var(--hull-light);stroke-width:.5;opacity:.35}.edge{fill:none;stroke:var(--line);stroke-width:.8;opacity:.55}.frame{stroke:var(--hull-shadow);stroke-width:.6}.gl{fill:none;stroke:var(--accent-cyan);stroke-width:.8;stroke-linecap:round;opacity:.8}.cs{fill:none;stroke:var(--accent-cyan);stroke-width:1.1;opacity:.55}.st{fill:none;stroke:var(--hull-shadow);stroke-width:2.6;stroke-linecap:round}.st2{fill:none;stroke:var(--hull-shadow);stroke-width:1.6;stroke-linecap:round}.pipe{fill:none;stroke:var(--hull-dark);stroke-width:2.4}.pipe2{fill:none;stroke:var(--hull-dark);stroke-width:1.6}.ls{fill:none;stroke:var(--hull-shadow);stroke-linecap:round}.lm{fill:none;stroke:var(--hull-mid);stroke-linecap:round}.lh{fill:none;stroke:var(--hull-light);stroke-linecap:round;opacity:.6}.dash{fill:none;stroke:var(--accent-amber);stroke-width:1;stroke-dasharray:6 4;opacity:.85}.node{fill:none;stroke:none}</style>
<defs><linearGradient id="mc-c"><stop offset="0" class="hm"/><stop offset=".25" class="hl"/><stop offset=".55" class="hm"/><stop offset="1" class="hs"/></linearGradient><linearGradient id="mc-d"><stop offset="0" class="hs"/><stop offset=".25" class="hd"/><stop offset=".55" class="hs"/><stop offset="1" class="md"/></linearGradient><linearGradient id="mc-m"><stop offset="0" class="hd"/><stop offset=".25" class="hm"/><stop offset=".55" class="hd"/><stop offset="1" class="hs"/></linearGradient><linearGradient id="mc-r"><stop offset="0" class="cy" stop-opacity="0"/><stop offset="1" class="cy" stop-opacity=".16"/></linearGradient></defs>
<g id="body"><rect x="10" y="72" width="20" height="8" fill="url(#mc-d)"/><rect x="18" y="24" width="4" height="48" fill="url(#mc-c)"/><rect x="15" y="22" width="10" height="4" fill="url(#mc-d)"/><rect x="16" y="3" width="8" height="5" rx="1" fill="url(#mc-d)"/><rect x="6" y="8" width="28" height="14" rx="1.2" fill="url(#mc-c)"/><circle cx="13" cy="15" r="4.4" class="fmd frame"/><circle cx="13" cy="15" r="2.6" class="fln"/><rect x="22" y="12" width="9" height="2.4" rx=".6" class="fln"/><rect x="22" y="16.5" width="9" height="1.2" class="pl" opacity=".7"/></g>
<g id="details"><path class="gl" d="M11 13.4Q12 12.4 13.4 12.6"/><rect x="18" y="40" width="4" height=".9" class="fcy" opacity=".5"/><path class="edge" d="M6.4 10V20M33.6 10V20"/><rect x="29" y="8" width="5" height="14" fill="url(#mc-r)"/></g>
<g id="lights"><circle cx="30" cy="19" r="1.8" class="fcy" opacity=".22"/><circle cx="30" cy="19" r="1.2" class="fcy"/></g>
<g id="nodes"><circle class="node" data-type="surface" data-x="20" data-y="80" cx="20" cy="80" r="2"/></g>
</svg>
