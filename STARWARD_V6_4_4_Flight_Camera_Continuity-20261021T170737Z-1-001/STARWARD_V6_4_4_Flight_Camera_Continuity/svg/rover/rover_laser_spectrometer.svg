<!-- rover_laser_spectrometer.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" data-part-id="rover_laser_spectrometer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>:root{--hull-light:#e8eef5;--hull-mid:#b8c4d2;--hull-dark:#6d7c8f;--hull-shadow:#3a4656;--metal-dark:#2a3340;--accent-cyan:#22e5f0;--accent-amber:#ffb347;--glow-engine:#ff7a2f;--solar-cell:#1b3a6b;--solar-grid:#4f7fc0;--line:#0e1520}.hl{stop-color:var(--hull-light)}.hm{stop-color:var(--hull-mid)}.hd{stop-color:var(--hull-dark)}.hs{stop-color:var(--hull-shadow)}.md{stop-color:var(--metal-dark)}.cy{stop-color:var(--accent-cyan)}.ge{stop-color:var(--glow-engine)}.am{stop-color:var(--accent-amber)}.fmd{fill:var(--metal-dark)}.fln{fill:var(--line)}.fcy{fill:var(--accent-cyan)}.fam{fill:var(--accent-amber)}.fge{fill:var(--glow-engine)}.fsc{fill:var(--solar-cell)}.pl{fill:none;stroke:var(--line);stroke-width:.5;opacity:.45}.hi{fill:none;stroke:var(--hull-light);stroke-width:.5;opacity:.35}.edge{fill:none;stroke:var(--line);stroke-width:.8;opacity:.55}.frame{stroke:var(--hull-shadow);stroke-width:.6}.gl{fill:none;stroke:var(--accent-cyan);stroke-width:.8;stroke-linecap:round;opacity:.8}.cs{fill:none;stroke:var(--accent-cyan);stroke-width:1.1;opacity:.55}.st{fill:none;stroke:var(--hull-shadow);stroke-width:2.6;stroke-linecap:round}.st2{fill:none;stroke:var(--hull-shadow);stroke-width:1.6;stroke-linecap:round}.pipe{fill:none;stroke:var(--hull-dark);stroke-width:2.4}.pipe2{fill:none;stroke:var(--hull-dark);stroke-width:1.6}.ls{fill:none;stroke:var(--hull-shadow);stroke-linecap:round}.lm{fill:none;stroke:var(--hull-mid);stroke-linecap:round}.lh{fill:none;stroke:var(--hull-light);stroke-linecap:round;opacity:.6}.dash{fill:none;stroke:var(--accent-amber);stroke-width:1;stroke-dasharray:6 4;opacity:.85}.node{fill:none;stroke:none}</style>
<defs><linearGradient id="rs-c"><stop offset="0" class="hm"/><stop offset=".25" class="hl"/><stop offset=".55" class="hm"/><stop offset="1" class="hs"/></linearGradient><linearGradient id="rs-d"><stop offset="0" class="hs"/><stop offset=".25" class="hd"/><stop offset=".55" class="hs"/><stop offset="1" class="md"/></linearGradient><linearGradient id="rs-m"><stop offset="0" class="hd"/><stop offset=".25" class="hm"/><stop offset=".55" class="hd"/><stop offset="1" class="hs"/></linearGradient><linearGradient id="rs-r"><stop offset="0" class="cy" stop-opacity="0"/><stop offset="1" class="cy" stop-opacity=".16"/></linearGradient></defs>
<g id="body"><rect x="8" y="26" width="24" height="14" fill="url(#rs-c)"/><rect x="6" y="24" width="28" height="3" fill="url(#rs-d)"/><rect x="21" y="11" width="16" height="6" rx="1" fill="url(#rs-d)"/><rect x="6" y="8" width="28" height="17" rx="2" fill="url(#rs-c)"/><circle cx="14" cy="16.5" r="4.4" class="fmd frame"/><circle cx="14" cy="16.5" r="2.5" class="fln"/><ellipse cx="37" cy="14" rx="1.1" ry="2.6" class="fln"/></g>
<g id="details"><circle cx="14" cy="16.5" r=".9" class="fcy"/><rect x="6" y="21.5" width="28" height="1" class="fcy" opacity=".5"/><path class="pl" d="M22 8V25"/><path class="edge" d="M6.4 10V23"/><rect x="29" y="8" width="5" height="17" fill="url(#rs-r)"/><rect x="29" y="26" width="3" height="14" fill="url(#rs-r)"/></g>
<g id="lights"><circle cx="27" cy="33" r="2.6" class="fam" opacity=".22"/><circle cx="27" cy="33" r="1.2" class="fam"/><circle cx="13" cy="33" r="2.6" class="fcy" opacity=".22"/><circle cx="13" cy="33" r="1.2" class="fcy"/></g>
<g id="nodes"><circle class="node" data-type="surface" data-x="20" data-y="40" cx="20" cy="40" r="2"/></g>
</svg>
