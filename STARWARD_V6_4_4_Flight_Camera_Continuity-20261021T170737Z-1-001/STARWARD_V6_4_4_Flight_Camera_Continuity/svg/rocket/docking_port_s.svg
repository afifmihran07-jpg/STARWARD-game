<!-- docking_port_s.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 20" width="40" height="20" data-part-id="docking_port_s" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>:root{--hull-light:#e8eef5;--hull-mid:#b8c4d2;--hull-dark:#6d7c8f;--hull-shadow:#3a4656;--metal-dark:#2a3340;--accent-cyan:#22e5f0;--accent-amber:#ffb347;--glow-engine:#ff7a2f;--solar-cell:#1b3a6b;--solar-grid:#4f7fc0;--line:#0e1520}.hl{stop-color:var(--hull-light)}.hm{stop-color:var(--hull-mid)}.hd{stop-color:var(--hull-dark)}.hs{stop-color:var(--hull-shadow)}.md{stop-color:var(--metal-dark)}.cy{stop-color:var(--accent-cyan)}.ge{stop-color:var(--glow-engine)}.fmd{fill:var(--metal-dark)}.fln{fill:var(--line)}.fcy{fill:var(--accent-cyan)}.fam{fill:var(--accent-amber)}.fge{fill:var(--glow-engine)}.fsc{fill:var(--solar-cell)}.pl{fill:none;stroke:var(--line);stroke-width:.5;opacity:.45}.hi{fill:none;stroke:var(--hull-light);stroke-width:.5;opacity:.35}.edge{fill:none;stroke:var(--line);stroke-width:.8;opacity:.55}.frame{stroke:var(--hull-shadow);stroke-width:.6}.gl{fill:none;stroke:var(--accent-cyan);stroke-width:.8;stroke-linecap:round;opacity:.8}.cs{fill:none;stroke:var(--accent-cyan);stroke-width:1.1;opacity:.55}.st{fill:none;stroke:var(--hull-shadow);stroke-width:2.6;stroke-linecap:round}.st2{fill:none;stroke:var(--hull-shadow);stroke-width:1.6;stroke-linecap:round}.pipe{fill:none;stroke:var(--hull-dark);stroke-width:2.4}.pipe2{fill:none;stroke:var(--hull-dark);stroke-width:1.6}.ls{fill:none;stroke:var(--hull-shadow);stroke-linecap:round}.lm{fill:none;stroke:var(--hull-mid);stroke-linecap:round}.lh{fill:none;stroke:var(--hull-light);stroke-linecap:round;opacity:.6}.dash{fill:none;stroke:var(--accent-amber);stroke-width:1;stroke-dasharray:6 4;opacity:.85}.node{fill:none;stroke:none}</style>
<defs><linearGradient id="dp-c"><stop offset="0" class="hm"/><stop offset=".25" class="hl"/><stop offset=".55" class="hm"/><stop offset="1" class="hs"/></linearGradient><linearGradient id="dp-d"><stop offset="0" class="hs"/><stop offset=".25" class="hd"/><stop offset=".55" class="hs"/><stop offset="1" class="md"/></linearGradient><linearGradient id="dp-m"><stop offset="0" class="hd"/><stop offset=".25" class="hm"/><stop offset=".55" class="hd"/><stop offset="1" class="hs"/></linearGradient><linearGradient id="dp-r"><stop offset="0" class="cy" stop-opacity="0"/><stop offset="1" class="cy" stop-opacity=".16"/></linearGradient><clipPath id="dp-k"><path d="M8 6H32L40 14V20H0V14Z"/></clipPath></defs>
<g id="body"><path d="M8 6H32L40 14V20H0V14Z" fill="url(#dp-c)"/><rect x="8" width="24" height="6" rx="1.5" fill="url(#dp-d)"/><rect y="16" width="40" height="4" fill="url(#dp-d)"/><rect x="11" width="3" height="2" fill="url(#dp-c)"/><rect x="19" width="3" height="2" fill="url(#dp-c)"/><rect x="27" width="3" height="2" fill="url(#dp-c)"/></g>
<g id="details"><path class="cs" d="M3 11H37"/><path class="pl" d="M0 14H40"/><g clip-path="url(#dp-k)"><rect x="28" width="12" height="20" fill="url(#dp-r)"/></g></g>
<g id="lights"><circle cx="6" cy="18" r="2.6" class="fcy" opacity=".22"/><circle cx="6" cy="18" r="1.2" class="fcy"/><circle cx="34" cy="18" r="2.6" class="fam" opacity=".22"/><circle cx="34" cy="18" r="1.2" class="fam"/></g>
<g id="nodes"><circle class="node" data-type="stack-top" data-x="20" data-y="0" cx="20" cy="0" r="2"/><circle class="node" data-type="stack-bottom" data-x="20" data-y="20" cx="20" cy="20" r="2"/></g>
</svg>
