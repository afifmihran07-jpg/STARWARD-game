<!-- heat_shield_m.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 20" width="80" height="20" data-part-id="heat_shield_m" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>:root{--hull-light:#e8eef5;--hull-mid:#b8c4d2;--hull-dark:#6d7c8f;--hull-shadow:#3a4656;--metal-dark:#2a3340;--accent-cyan:#22e5f0;--accent-amber:#ffb347;--glow-engine:#ff7a2f;--solar-cell:#1b3a6b;--solar-grid:#4f7fc0;--line:#0e1520}.hl{stop-color:var(--hull-light)}.hm{stop-color:var(--hull-mid)}.hd{stop-color:var(--hull-dark)}.hs{stop-color:var(--hull-shadow)}.md{stop-color:var(--metal-dark)}.cy{stop-color:var(--accent-cyan)}.ge{stop-color:var(--glow-engine)}.am{stop-color:var(--accent-amber)}.fmd{fill:var(--metal-dark)}.fln{fill:var(--line)}.fcy{fill:var(--accent-cyan)}.fam{fill:var(--accent-amber)}.fge{fill:var(--glow-engine)}.fsc{fill:var(--solar-cell)}.pl{fill:none;stroke:var(--line);stroke-width:.5;opacity:.45}.hi{fill:none;stroke:var(--hull-light);stroke-width:.5;opacity:.35}.edge{fill:none;stroke:var(--line);stroke-width:.8;opacity:.55}.frame{stroke:var(--hull-shadow);stroke-width:.6}.gl{fill:none;stroke:var(--accent-cyan);stroke-width:.8;stroke-linecap:round;opacity:.8}.cs{fill:none;stroke:var(--accent-cyan);stroke-width:1.1;opacity:.55}.st{fill:none;stroke:var(--hull-shadow);stroke-width:2.6;stroke-linecap:round}.st2{fill:none;stroke:var(--hull-shadow);stroke-width:1.6;stroke-linecap:round}.pipe{fill:none;stroke:var(--hull-dark);stroke-width:2.4}.pipe2{fill:none;stroke:var(--hull-dark);stroke-width:1.6}.ls{fill:none;stroke:var(--hull-shadow);stroke-linecap:round}.lm{fill:none;stroke:var(--hull-mid);stroke-linecap:round}.lh{fill:none;stroke:var(--hull-light);stroke-linecap:round;opacity:.6}.dash{fill:none;stroke:var(--accent-amber);stroke-width:1;stroke-dasharray:6 4;opacity:.85}.node{fill:none;stroke:none}</style>
<defs><linearGradient id="hs-c"><stop offset="0" class="hm"/><stop offset=".25" class="hl"/><stop offset=".55" class="hm"/><stop offset="1" class="hs"/></linearGradient><linearGradient id="hs-d"><stop offset="0" class="hs"/><stop offset=".25" class="hd"/><stop offset=".55" class="hs"/><stop offset="1" class="md"/></linearGradient><linearGradient id="hs-m"><stop offset="0" class="hd"/><stop offset=".25" class="hm"/><stop offset=".55" class="hd"/><stop offset="1" class="hs"/></linearGradient><linearGradient id="hs-r"><stop offset="0" class="cy" stop-opacity="0"/><stop offset="1" class="cy" stop-opacity=".16"/></linearGradient><clipPath id="hs-k"><path d="M0 0H80V6Q76 16 40 20Q4 16 0 6Z"/></clipPath><pattern id="hs-t" width="8" height="5" patternUnits="userSpaceOnUse"><path d="M0 0H8M0 2.5H8M0 0V2.5M4 2.5V5" style="fill:none;stroke:var(--line);stroke-width:.4;opacity:.6"/></pattern><radialGradient id="hs-ch" cx=".5" cy="1" r=".9"><stop offset="0" style="stop-color:var(--line)" stop-opacity=".75"/><stop offset="1" style="stop-color:var(--line)" stop-opacity="0"/></radialGradient></defs>
<g id="body"><path d="M0 0H80V6Q76 16 40 20Q4 16 0 6Z" fill="url(#hs-d)"/><g clip-path="url(#hs-k)"><rect width="80" height="20" fill="url(#hs-t)"/><rect width="80" height="20" fill="url(#hs-ch)"/></g><rect width="80" height="4" fill="url(#hs-c)"/></g>
<g id="details"><path d="M2 9Q14 17 40 19.4Q66 17 78 9" fill="none" style="stroke:var(--glow-engine);stroke-width:1;opacity:.35"/><path class="edge" d="M.4 0V6M79.6 0V6"/><rect y="4" width="80" height="1" class="fcy" opacity=".45"/></g>
<g id="lights"><circle cx="8" cy="2" r="2.6" class="fcy" opacity=".22"/><circle cx="8" cy="2" r="1.2" class="fcy"/></g>
<g id="nodes"><circle class="node" data-type="stack-top" data-x="40" data-y="0" cx="40" cy="0" r="2"/></g>
</svg>
